<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Learning Engine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e1e6; min-height: 100vh; }

  /* Header */
  .header { background: #161822; padding: 18px 32px; border-bottom: 1px solid #2a2d3a; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .user-select { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .header select { background: #1e2030; color: #e1e1e6; border: 1px solid #3a3d4a; border-radius: 8px; padding: 8px 12px; font-size: 14px; }

  /* Layout */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Cards */
  .card { background: #161822; border: 1px solid #2a2d3a; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 16px; color: #c4c4cc; }

  /* User profile */
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .profile-grid .tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin: 2px; }
  .tag.strong { background: #1a3a2a; color: #4ade80; }
  .tag.weak { background: #3a1a1a; color: #f87171; }

  /* Recommendations */
  .rec-list { display: flex; flex-direction: column; gap: 12px; }
  .rec-item { background: #1e2030; border: 1px solid #2a2d3a; border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color 0.2s; display: flex; align-items: center; gap: 16px; }
  .rec-item:hover { border-color: #6366f1; }
  .rec-item.active { border-color: #6366f1; background: #1e1e3a; }
  .rec-badge { background: #6366f1; color: white; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .rec-info { flex: 1; }
  .rec-info .source { font-size: 12px; color: #8888a0; }
  .rec-info .label { font-size: 15px; font-weight: 500; }
  .rec-score { font-size: 13px; color: #8888a0; }

  /* Question view */
  .question-view { display: none; }
  .question-view.visible { display: block; }
  .question-img { max-width: 100%; border-radius: 8px; background: white; }
  .hint-btn { background: #2a2d3a; color: #c4c4cc; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-top: 10px; transition: background 0.2s; }
  .hint-btn:hover { background: #3a3d5a; }
  .hint-box { background: #1e2030; border-left: 3px solid #6366f1; padding: 12px 16px; margin-top: 10px; border-radius: 0 8px 8px 0; font-size: 14px; display: none; }
  .hint-box.visible { display: block; }

  /* Upload */
  .upload-area { border: 2px dashed #3a3d4a; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: border-color 0.2s; margin-top: 16px; }
  .upload-area:hover { border-color: #6366f1; }
  .upload-area.dragging { border-color: #6366f1; background: #1e1e3a; }
  .upload-area input { display: none; }
  .upload-area p { color: #8888a0; font-size: 14px; }
  .upload-preview { max-width: 300px; border-radius: 8px; margin-top: 12px; }
  .submit-btn { background: #6366f1; color: white; border: none; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
  .submit-btn:hover { background: #4f46e5; }
  .submit-btn:disabled { background: #3a3d4a; cursor: not-allowed; }

  /* Results */
  .results { display: none; }
  .results.visible { display: block; }
  .score-display { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
  .score-circle.high { background: #1a3a2a; color: #4ade80; border: 3px solid #4ade80; }
  .score-circle.mid { background: #3a3a1a; color: #facc15; border: 3px solid #facc15; }
  .score-circle.low { background: #3a1a1a; color: #f87171; border: 3px solid #f87171; }
  .feedback-text { font-size: 14px; line-height: 1.6; color: #c4c4cc; }
  .well-list, .improve-list { margin-top: 8px; padding-left: 20px; font-size: 14px; }
  .well-list li { color: #4ade80; margin-bottom: 4px; }
  .improve-list li { color: #f87171; margin-bottom: 4px; }
  .images-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .images-row img { width: 100%; border-radius: 8px; background: white; cursor: pointer; transition: transform 0.2s; }
  .images-row img:hover { transform: scale(1.02); }
  .images-row .img-label { font-size: 13px; color: #8888a0; margin-bottom: 6px; font-weight: 600; }
  .vector-badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 8px; }
  .vector-badge.updated { background: #1a3a2a; color: #4ade80; }
  .vector-badge.not-updated { background: #3a3a1a; color: #facc15; }

  /* Chat */
  .chat-section { display: none; margin-top: 20px; }
  .chat-section.visible { display: block; }
  .chat-messages { max-height: 400px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; max-width: 80%; }
  .chat-msg.user { background: #6366f1; color: white; align-self: flex-end; }
  .chat-msg.ai { background: #1e2030; color: #e1e1e6; align-self: flex-start; border: 1px solid #2a2d3a; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; background: #1e2030; color: #e1e1e6; border: 1px solid #3a3d4a; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .chat-input-row button { background: #6366f1; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; }

  /* Loading */
  .spinner { display: none; margin: 20px auto; width: 36px; height: 36px; border: 3px solid #2a2d3a; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
  .spinner.visible { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Annotations list */
  .annotation-list { margin-top: 12px; }
  .annotation-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #2a2d3a; font-size: 14px; }
  .annotation-badge { min-width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }
  .annotation-badge.error { background: #ef4444; }
  .annotation-badge.correct { background: #22c55e; }
  .annotation-badge.missing { background: #f97316; }
  .annotation-badge.suggestion { background: #3b82f6; }

  /* Key takeaways */
  .takeaways { background: #1a2a3a; border: 1px solid #2a4a5a; border-radius: 8px; padding: 14px; margin-top: 12px; }
  .takeaways h3 { font-size: 14px; color: #60a5fa; margin-bottom: 8px; }
  .takeaways li { font-size: 13px; color: #c4c4cc; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>Adaptive Learning Engine</h1>
  <div class="user-select">
    <label for="userPick" style="font-size:14px; color:#8888a0;">Student:</label>
    <select id="userPick"></select>
  </div>
</div>

<div class="container">
  <!-- User Profile -->
  <div class="card" id="profileCard" style="display:none;">
    <h2 id="profileName"></h2>
    <div class="profile-grid">
      <div>
        <div style="font-size:13px; color:#8888a0; margin-bottom:6px;">Top Strengths</div>
        <div id="strengths"></div>
      </div>
      <div>
        <div style="font-size:13px; color:#8888a0; margin-bottom:6px;">Top Weaknesses</div>
        <div id="weaknesses"></div>
      </div>
    </div>
  </div>

  <!-- Recommendations -->
  <div class="card" id="recCard" style="display:none;">
    <h2>Recommended Questions</h2>
    <div class="rec-list" id="recList"></div>
  </div>

  <!-- Question View -->
  <div class="card question-view" id="questionCard">
    <h2 id="questionTitle"></h2>
    <img class="question-img" id="questionImg" alt="Question" />
    <div id="hintsArea">
      <button class="hint-btn" onclick="getHint(1)">Hint 1 (gentle)</button>
      <button class="hint-btn" onclick="getHint(2)">Hint 2 (moderate)</button>
      <button class="hint-btn" onclick="getHint(3)">Hint 3 (specific)</button>
      <div class="hint-box" id="hintBox"></div>
    </div>

    <!-- Upload -->
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" />
      <p>Click or drag &amp; drop your answer image here</p>
      <img class="upload-preview" id="uploadPreview" style="display:none;" />
    </div>
    <button class="submit-btn" id="submitBtn" disabled onclick="submitAnswer()">Submit Answer</button>
    <div class="spinner" id="submitSpinner"></div>
  </div>

  <!-- Results -->
  <div class="card results" id="resultsCard">
    <h2>Results</h2>
    <div class="score-display">
      <div class="score-circle" id="scoreCircle"></div>
      <div>
        <div style="font-size:18px; font-weight:600;" id="scoreText"></div>
        <div class="vector-badge" id="vectorBadge"></div>
      </div>
    </div>
    <div class="feedback-text" id="overallFeedback"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px;">
      <div>
        <div style="font-size:13px; color:#4ade80; font-weight:600;">What went well</div>
        <ul class="well-list" id="wellList"></ul>
      </div>
      <div>
        <div style="font-size:13px; color:#f87171; font-weight:600;">Areas for improvement</div>
        <ul class="improve-list" id="improveList"></ul>
      </div>
    </div>

    <!-- Annotations -->
    <h2 style="margin-top:20px;">Annotations</h2>
    <div class="annotation-list" id="annotationList"></div>

    <!-- Solution image only -->
    <div class="images-row" id="imagesRow">
      <div>
        <div class="img-label">Model solution</div>
        <img id="solutionImg" alt="Solution" />
      </div>
    </div>

    <!-- Takeaways -->
    <div class="takeaways" id="takeawaysBox" style="display:none;">
      <h3>Key Takeaways</h3>
      <ul id="takeawaysList"></ul>
    </div>
  </div>

  <!-- Chat -->
  <div class="card chat-section" id="chatCard">
    <h2>Ask the AI Tutor</h2>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Ask about your mistakes..." onkeydown="if(event.key==='Enter')sendChat()" />
      <button onclick="sendChat()">Send</button>
    </div>
  </div>
</div>

<script>
const API = '';
let currentUser = null;
let currentProblem = null;
let currentFile = null;
let sessionId = null;
let attempt = 1;

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  const res = await fetch(`${API}/users`);
  const data = await res.json();
  const sel = document.getElementById('userPick');
  sel.innerHTML = '<option value="">Select a student...</option>';
  data.users.forEach(u => {
    sel.innerHTML += `<option value="${u.user_id}">${u.name} — ${u.description}</option>`;
  });
  sel.onchange = () => { currentUser = sel.value; if (currentUser) loadUser(); };
}

// ── Load user profile + recommendations ───────────────────────────────────
async function loadUser() {
  // Reset state
  document.getElementById('questionCard').classList.remove('visible');
  document.getElementById('resultsCard').classList.remove('visible');
  document.getElementById('chatCard').classList.remove('visible');
  attempt = 1;
  currentProblem = null;
  sessionId = null;

  const [profileRes, recRes] = await Promise.all([
    fetch(`${API}/user/${currentUser}`),
    fetch(`${API}/recommend?user_id=${currentUser}&top=5`)
  ]);
  const profile = await profileRes.json();
  const recs = await recRes.json();

  // Profile
  document.getElementById('profileCard').style.display = 'block';
  document.getElementById('profileName').textContent = `${profile.name} — ${profile.description} (${profile.completed_count} completed)`;

  const sEl = document.getElementById('strengths');
  sEl.innerHTML = '';
  (profile.top_strengths || []).forEach(s => {
    sEl.innerHTML += `<span class="tag strong">${s.topic}: ${s.score}</span>`;
  });

  const wEl = document.getElementById('weaknesses');
  wEl.innerHTML = '';
  (profile.top_weaknesses || []).forEach(w => {
    wEl.innerHTML += `<span class="tag weak">${w.topic}: ${w.score}</span>`;
  });

  // Recommendations
  document.getElementById('recCard').style.display = 'block';
  const list = document.getElementById('recList');
  list.innerHTML = '';
  recs.recommendations.forEach(r => {
    const div = document.createElement('div');
    div.className = 'rec-item';
    div.innerHTML = `
      <span class="rec-badge">${r.question}</span>
      <div class="rec-info">
        <div class="label">${r.question}</div>
        <div class="source">${r.source}</div>
      </div>
      <span class="rec-score">score: ${r.score}</span>
    `;
    div.onclick = () => selectProblem(r.problem_id, div);
    list.appendChild(div);
  });
}

// ── Select a problem ──────────────────────────────────────────────────────
async function selectProblem(pid, el) {
  document.querySelectorAll('.rec-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  currentProblem = pid;

  // Reset
  document.getElementById('resultsCard').classList.remove('visible');
  document.getElementById('chatCard').classList.remove('visible');
  document.getElementById('hintBox').classList.remove('visible');
  document.getElementById('uploadPreview').style.display = 'none';
  document.getElementById('submitBtn').disabled = true;
  currentFile = null;
  attempt = 1;

  const res = await fetch(`${API}/problem/${pid}`);
  const prob = await res.json();

  document.getElementById('questionTitle').textContent = `${prob.source} — ${prob.question}`;
  document.getElementById('questionImg').src = `${API}/problem/${pid}/image`;
  document.getElementById('questionCard').classList.add('visible');
}

// ── Hints ─────────────────────────────────────────────────────────────────
async function getHint(n) {
  if (!currentProblem || !currentUser) return;
  const res = await fetch(`${API}/problem/${currentProblem}/hint`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ user_id: currentUser, hint_number: n })
  });
  const data = await res.json();
  const box = document.getElementById('hintBox');
  box.textContent = `Hint ${n}: ${data.hint}`;
  box.classList.add('visible');
}

// ── File upload ───────────────────────────────────────────────────────────
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');

fileInput.onchange = (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
};
uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.classList.add('dragging'); };
uploadArea.ondragleave = () => uploadArea.classList.remove('dragging');
uploadArea.ondrop = (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragging');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
};

function handleFile(file) {
  currentFile = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById('uploadPreview');
    preview.src = e.target.result;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
  document.getElementById('submitBtn').disabled = false;
}

// ── Submit answer ─────────────────────────────────────────────────────────
async function submitAnswer() {
  if (!currentFile || !currentProblem || !currentUser) return;
  const btn = document.getElementById('submitBtn');
  const spinner = document.getElementById('submitSpinner');
  btn.disabled = true;
  spinner.classList.add('visible');

  const form = new FormData();
  form.append('file', currentFile);
  form.append('user_id', currentUser);
  form.append('attempt', attempt);

  try {
    const res = await fetch(`${API}/problem/${currentProblem}/submit-image-upload`, {
      method: 'POST', body: form
    });
    const data = await res.json();
    showResults(data);
  } catch (err) {
    alert('Error submitting: ' + err.message);
  } finally {
    spinner.classList.remove('visible');
    btn.disabled = false;
  }
}

// ── Show results ──────────────────────────────────────────────────────────
function showResults(data) {
  sessionId = data.session_id;
  attempt++;

  // Score
  const score = data.score;
  const circle = document.getElementById('scoreCircle');
  circle.textContent = `${score}/10`;
  circle.className = 'score-circle ' + (score >= 7 ? 'high' : score >= 4 ? 'mid' : 'low');

  document.getElementById('scoreText').textContent =
    `Final score: ${(data.final_score * 100).toFixed(0)}% | ${data.is_complete ? 'Complete' : 'Try again for higher score'}`;

  const badge = document.getElementById('vectorBadge');
  if (data.vector_updated) {
    badge.textContent = 'Profile updated';
    badge.className = 'vector-badge updated';
  } else {
    badge.textContent = 'Score below 70% — profile not updated yet';
    badge.className = 'vector-badge not-updated';
  }

  // Feedback
  document.getElementById('overallFeedback').textContent = data.overall_feedback;

  const wellList = document.getElementById('wellList');
  wellList.innerHTML = '';
  (data.what_went_well || []).forEach(t => wellList.innerHTML += `<li>${t}</li>`);

  const impList = document.getElementById('improveList');
  impList.innerHTML = '';
  (data.areas_for_improvement || []).forEach(t => impList.innerHTML += `<li>${t}</li>`);

  // Annotations
  const annList = document.getElementById('annotationList');
  annList.innerHTML = '';
  (data.annotations || []).forEach(a => {
    annList.innerHTML += `
      <div class="annotation-item">
        <div class="annotation-badge ${a.type}">${a.label}</div>
        <div><strong style="text-transform:capitalize;">${a.type}:</strong> ${a.feedback}</div>
      </div>`;
  });

  // Solution image (click to open full-size in new tab)
  const solImg = document.getElementById('solutionImg');
  solImg.src = `${API}${data.solution_image_url}`;
  solImg.onclick = () => window.open(solImg.src, '_blank');
  solImg.onerror = function() { this.parentElement.style.display = 'none'; };

  // Takeaways
  const tkBox = document.getElementById('takeawaysBox');
  if (data.key_takeaways && data.key_takeaways.length > 0) {
    tkBox.style.display = 'block';
    const tkList = document.getElementById('takeawaysList');
    tkList.innerHTML = '';
    data.key_takeaways.forEach(t => tkList.innerHTML += `<li>${t}</li>`);
  } else {
    tkBox.style.display = 'none';
  }

  document.getElementById('resultsCard').classList.add('visible');
  document.getElementById('chatCard').classList.add('visible');
  document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth' });

  // Refresh profile in background
  loadUserProfile();
}

async function loadUserProfile() {
  const res = await fetch(`${API}/user/${currentUser}`);
  const profile = await res.json();
  document.getElementById('profileName').textContent = `${profile.name} — ${profile.description} (${profile.completed_count} completed)`;
  const sEl = document.getElementById('strengths');
  sEl.innerHTML = '';
  (profile.top_strengths || []).forEach(s => sEl.innerHTML += `<span class="tag strong">${s.topic}: ${s.score}</span>`);
  const wEl = document.getElementById('weaknesses');
  wEl.innerHTML = '';
  (profile.top_weaknesses || []).forEach(w => wEl.innerHTML += `<span class="tag weak">${w.topic}: ${w.score}</span>`);
}

// ── Chat ──────────────────────────────────────────────────────────────────
async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg || !sessionId) return;
  input.value = '';

  const messages = document.getElementById('chatMessages');
  messages.innerHTML += `<div class="chat-msg user">${msg}</div>`;
  messages.scrollTop = messages.scrollHeight;

  const res = await fetch(`${API}/chat`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ session_id: sessionId, message: msg })
  });
  const data = await res.json();

  // Render markdown-like formatting (bold, lists)
  let reply = data.reply
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n- /g, '<br>- ')
    .replace(/\n/g, '<br>');
  messages.innerHTML += `<div class="chat-msg ai">${reply}</div>`;
  messages.scrollTop = messages.scrollHeight;
}

init();
</script>
</body>
</html>
